version: "3"
services:
  db:
    container_name: pg-prod
    image: postgres:9.6
    networks:
      - prod_net_back
    environment:
      - POSTGRES_PASSWORD=passwd
      - POSTGRES_DB=tasks
    volumes:
      - prod_postgresql:/var/lib/postgresql
      - prod_postgresql_data:/var/lib/postgresql/data

  rabbitmq:
    container_name: rabbitmq-prod
    image: rabbitmq:3.13-management
    networks:
      - prod_net_back
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  keycloak:
    container_name: keycloak-prod
    image: quay.io/keycloak/keycloak:23.0
    ports:
      - "8182:8080"   # porta diferente para nao conflitar com keycloak de dev (8180)
    networks:
      - prod_net_back
      - prod_net_front
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_URL: http://localhost:8182
      KC_HOSTNAME_ADMIN_URL: http://localhost:8182
    volumes:
      - keycloak_data:/opt/keycloak/data
    command: start-dev

  backend:
    container_name: backend-prod
    image: back_prod:build_${BUILD_NUMBER}
    build:
      context: .
      args:
        - WAR_FILE=target/tasks-backend.war
        - CONTEXT=tasks-backend
    networks:
      - prod_net_back
      - prod_net_front
    #ports:
    #  - 9998:8080
    environment:
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWD=passwd
      - DATABASE_UPDATE=validate
      - RABBITMQ_HOST=rabbitmq
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
    depends_on:
      - db
      - rabbitmq
      - keycloak

  frontend:
    container_name: frontend-prod
    image: front_prod:build_${BUILD_NUMBER}
    build:
        context: frontend
        args:
          - WAR_FILE=target/tasks.war
          - CONTEXT=tasks
    networks:
      - prod_net_front
    ports:
      - 9999:8080
    environment:
      - BACKEND_HOST=backend
      - BACKEND_PORT=8080
      - APP_VERSION=build_${BUILD_NUMBER}
      - KEYCLOAK_HOST=keycloak
      - KEYCLOAK_PORT=8080
      - KEYCLOAK_BROWSER_HOST=localhost
      - KEYCLOAK_BROWSER_PORT=8182
      - APP_BASE_URL=http://localhost
    depends_on:
      - backend
      - keycloak

  nginx:
    container_name: nginx-prod
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - prod_net_front
    depends_on:
      - frontend
      - backend

networks:
  prod_net_front:
  prod_net_back:

volumes:
  prod_postgresql:
  prod_postgresql_data:
  keycloak_data: