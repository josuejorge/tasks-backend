events {}

http {
    # compressao de respostas de texto (css, js, json)
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json text/plain;

    # apps por tras do proxy (nomes de servico do docker-compose)
    upstream frontend_app {
        server frontend:8080;
    }
    upstream backend_app {
        server backend:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # raiz -> manda pro app
        location = / {
            return 302 /tasks/;
        }

        # frontend Thymeleaf (context path /tasks)
        location /tasks {
            proxy_pass http://frontend_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }

        # backend REST + swagger (context path /tasks-backend)
        location /tasks-backend {
            proxy_pass http://backend_app;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;
        }
    }
}
