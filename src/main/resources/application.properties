server.port=8001

# Atras de proxy reverso (Nginx): usa X-Forwarded-* p/ montar URLs externas corretas (Swagger)
server.forward-headers-strategy=framework

## default connection pool
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

## PostgreSQL
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST:127.0.0.1}:${DATABASE_PORT:5433}/tasks
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWD:password}

# Schema agora e gerenciado pelo Flyway; Hibernate so VALIDA que o schema bate com as entidades
spring.jpa.hibernate.ddl-auto=${DATABASE_UPDATE:validate}
#spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults = false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL9Dialect

## Flyway - migrations versionadas em src/main/resources/db/migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baselineOnMigrate: em banco que JA tem schema (ex: prod), faz o baseline em vez de rodar a V1
spring.flyway.baseline-on-migrate=true

## Redis
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=6379

## RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

## Keycloak - valida JWT pela chave publica (nao precisa do issuer bater em Docker)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8180}/realms/tasks-realm/protocol/openid-connect/certs

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
